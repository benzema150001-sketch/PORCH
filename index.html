    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch(e) {}
      })();

    <script>
      window.$_TSR = window.$_TSR || { h: function() {} };
      // Safely mount dark mode toggle after React hydration completes
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          if (document.getElementById('porch-theme-btn')) return;
          var btn = document.createElement('button');
          btn.id = 'porch-theme-btn';
          btn.type = 'button';
          btn.setAttribute('aria-label', 'Toggle dark mode theme');
          btn.style.cssText = 'position:fixed;bottom:1.25rem;right:1.25rem;z-index:9999;display:flex;align-items:center;gap:0.4rem;padding:0.5rem 0.85rem;border-radius:9999px;font-size:0.8125rem;font-weight:600;cursor:pointer;border:1px solid rgba(140,140,140,0.3);background:var(--card,#ffffff);color:var(--foreground,#111827);box-shadow:0 4px 14px rgba(0,0,0,0.15);transition:all 0.2s ease;backdrop-filter:blur(8px);';
          
          function updateBtn() {
            var isDark = document.documentElement.classList.contains('dark');
            btn.innerHTML = (isDark ? '☀️ ' : '🌙 ') + (isDark ? 'Light' : 'Dark');
          }
          updateBtn();

          btn.addEventListener('click', function(e) {
            e.stopPropagation();
            var isDark = document.documentElement.classList.contains('dark');
            if (isDark) {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
              try { localStorage.setItem('theme', 'light'); } catch(err) {}
            } else {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
              try { localStorage.setItem('theme', 'dark'); } catch(err) {}
            }
            updateBtn();
          });
          document.body.appendChild(btn);
        }, 300);
      });
    </script>
